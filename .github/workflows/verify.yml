name: Verificar Anatinus

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Testes do backend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Executar testes
        working-directory: backend
        run: python -m unittest discover -p "test_*.py"

      - name: Validar seeds de demonstração
        working-directory: backend
        run: |
          python -m py_compile seed_realista.py validate_demo_generation.py seed_apresentacao.py
          python seed_realista.py --informatica-only
          python validate_demo_generation.py --api
          python seed_realista.py
          python validate_demo_generation.py
          python validate_demo_generation.py --all-together
          python seed_apresentacao.py
          python validate_demo_generation.py --all-together

  frontend:
    name: Build do frontend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências
        working-directory: frontend
        run: npm install

      - name: Build de produção
        working-directory: frontend
        run: npm run build
